# harbour-dshq embedded cordis patch
# Applied after all bundle layers

# Disable the DeepSeek official provider (requires API key we don't have)
- id: llm-deepseek
  disabled: true

# Switch default model from deepseek-v4-flash to kilo-auto/free
- id: agent-default-model
  config:
    provider: kilo
    model: kilo-auto/free

# Configure opencode + kilo providers
- id: llm-pi-ai
  config:
    providers:
      opencode:
        apiKeyEnv: OPENCODE_API_KEY
        displayName: "OpenCode Zen (Free)"
        models:
          - id: big-pickle
          - id: deepseek-v4-flash-free
          - id: laguna-s-2.1-free
          - id: ling-3.0-flash-free
          - id: mimo-v2.5-free
          - id: nemotron-3-ultra-free
          - id: north-mini-code-free
      kilo:
        apiKeyEnv: ""
        displayName: "Kilo AI Gateway (Free)"
        models:
          - id: kilo-auto/free
            name: "Kilo Auto Free"
            contextWindow: 256000
            maxTokens: 10000
